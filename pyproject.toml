[project]
name = "napari-env"
version = "0.1.0"
description = "Create and uv environment and launch napari"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cropper",
    "napari-czitools>=0.12.4",
    "napari-nikon-nd2>=0.2.0",
    "napari-tiff>=0.1.6",
    "napari-vsi",
    "napari[all]>=0.9.0",
]

[project.scripts]
napari-env = "napari_env:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/napari_env"]

[tool.uv.sources]
napari-vsi = { git = "https://github.com/cwood1967/napari-vsi" }
cropper = { git = "https://github.com/cwood1967/napari-cropper" }


# --- pixi (parallel to the uv setup above; uv ignores this section) ---
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

# Only the interpreter comes from conda-forge; everything else is resolved
# from PyPI exactly as uv does, using [project].dependencies.
[tool.pixi.dependencies]
python = "3.12.*"

# pixi does not read [tool.uv.sources], so repeat the git sources here.
[tool.pixi.pypi-dependencies]
napari-vsi = { git = "https://github.com/cwood1967/napari-vsi" }
cropper = { git = "https://github.com/cwood1967/napari-cropper" }

[tool.pixi.tasks]
napari = "napari"
